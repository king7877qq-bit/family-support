name: Update verified USDT donations

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: update-usdt-donations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Read confirmed incoming USDT transfers
        env:
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
          WALLET: TYtWeZ6Xf9a8uACp35Bv2BpgmZjrHt8mTG
          USDT_CONTRACT: TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t
        run: |
          node <<'NODE'
          const fs = require('fs');
          const base = 'https://api.trongrid.io/v1/accounts/' + process.env.WALLET + '/transactions/trc20';
          const params = new URLSearchParams({
            only_confirmed: 'true',
            only_to: 'true',
            limit: '200',
            contract_address: process.env.USDT_CONTRACT,
            order_by: 'block_timestamp,asc'
          });
          const headers = { accept: 'application/json' };
          if (process.env.TRONGRID_API_KEY) headers['TRON-PRO-API-KEY'] = process.env.TRONGRID_API_KEY;
          async function main() {
            const seen = new Set();
            const transfers = [];
            let fingerprint = '';
            for (let page = 0; page < 100; page++) {
              const url = base + '?' + params.toString() + (fingerprint ? '&fingerprint=' + encodeURIComponent(fingerprint) : '');
              const response = await fetch(url, { headers });
              if (!response.ok) throw new Error('TronGrid HTTP ' + response.status + ': ' + (await response.text()).slice(0, 300));
              const body = await response.json();
              for (const tx of (body.data || [])) {
                const info = tx.token_info || {};
                if (String(info.address || '').toLowerCase() !== process.env.USDT_CONTRACT.toLowerCase()) continue;
                if (String(tx.to || '').toLowerCase() !== process.env.WALLET.toLowerCase()) continue;
                const key = String(tx.transaction_id || tx.transactionId || '') + ':' + String(tx.event_index ?? tx.eventIndex ?? '');
                if (!key || seen.has(key)) continue;
                seen.add(key);
                const decimals = Number(info.decimals ?? 6);
                const raw = BigInt(String(tx.value || '0'));
                const amount = Number(raw) / Math.pow(10, decimals);
                if (!Number.isFinite(amount) || amount <= 0) continue;
                transfers.push({ id: key, amount });
              }
              fingerprint = body.meta && body.meta.fingerprint || '';
              if (!fingerprint || !(body.data || []).length) break;
              if (page === 99) throw new Error('Pagination limit reached; refusing to publish an incomplete total.');
            }
            const total = transfers.reduce((sum, item) => sum + item.amount, 0);
            const result = {
              status: 'verified',
              network: 'TRON',
              token: 'USDT',
              wallet: process.env.WALLET,
              goal_usd: 2800,
              total_usdt: Number(total.toFixed(6)),
              total_usd: Number(total.toFixed(2)),
              transfer_count: transfers.length,
              updated_at: new Date().toISOString()
            };
            fs.writeFileSync('donations.json', JSON.stringify(result, null, 2) + '\n');
          }
          main().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Commit updated donation data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donations.json
          if git diff --cached --quiet; then
            echo "No donation data changes."
          else
            git commit -m "Update verified USDT donation total"
            git push
          fi
