name: Update verified USDT donations

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: update-usdt-donations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Read confirmed incoming USDT transfers
        env:
          TRONSCAN_API_KEY: ${{ secrets.TRONSCAN_API_KEY }}
          WALLET: TYtWeZ6Xf9a8uACp35Bv2BpgmZjrHt8mTG
          USDT_CONTRACT: TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t
        run: |
          node <<'NODE'
          const fs = require('fs');
          const API = 'https://apilist.tronscanapi.com/api/token_trc20/transfers';
          if (!process.env.TRONSCAN_API_KEY) throw new Error('Add the TRONSCAN_API_KEY repository secret before syncing.');
          const headers = { accept: 'application/json', 'TRON-PRO-API-KEY': process.env.TRONSCAN_API_KEY };
          async function main() {
            const seen = new Set();
            const transfers = [];
            let expectedTotal = null;
            for (let start = 0; ; start += 50) {
              const params = new URLSearchParams({
                toAddress: process.env.WALLET,
                contract_address: process.env.USDT_CONTRACT,
                direction: 'in',
                confirm: '0',
                start: String(start),
                limit: '50'
              });
              const response = await fetch(API + '?' + params.toString(), { headers });
              if (!response.ok) throw new Error('TronScan HTTP ' + response.status + ': ' + (await response.text()).slice(0, 300));
              const body = await response.json();
              if (!Array.isArray(body.token_transfers) || !Number.isFinite(Number(body.total))) {
                throw new Error('Unexpected TronScan response; refusing to publish a total.');
              }
              if (expectedTotal === null) {
                expectedTotal = Number(body.total);
                if (expectedTotal > 10000) throw new Error('TronScan API caps this endpoint at 10000 records; refusing to publish an incomplete total.');
              }
              for (const tx of body.token_transfers) {
                if (String(tx.contract_address || '').toLowerCase() !== process.env.USDT_CONTRACT.toLowerCase()) continue;
                if (String(tx.to_address || '').toLowerCase() !== process.env.WALLET.toLowerCase()) continue;
                if (tx.confirmed !== true || tx.revert === true || tx.finalResult !== 'SUCCESS' || tx.event_type !== 'Transfer') continue;
                if (String(tx.tokenInfo?.tokenId || '').toLowerCase() !== process.env.USDT_CONTRACT.toLowerCase()) continue;
                const key = [tx.transaction_id, tx.from_address, tx.to_address, tx.quant, tx.block].join(':');
                if (!tx.transaction_id || seen.has(key)) continue;
                seen.add(key);
                const decimals = Number(tx.tokenInfo?.tokenDecimal);
                if (!Number.isInteger(decimals) || decimals < 0 || decimals > 18) throw new Error('Invalid USDT decimal metadata; refusing to publish.');
                const raw = BigInt(String(tx.quant || '0'));
                const amount = Number(raw) / Math.pow(10, decimals);
                if (!Number.isFinite(amount) || amount <= 0) continue;
                transfers.push(amount);
              }
              if (start + 50 >= expectedTotal || body.token_transfers.length === 0) break;
              if (start >= 9950) throw new Error('Pagination limit reached; refusing to publish an incomplete total.');
            }
            const total = transfers.reduce((sum, amount) => sum + amount, 0);
            const result = {
              status: 'verified',
              network: 'TRON',
              token: 'USDT',
              wallet: process.env.WALLET,
              goal_usd: 2800,
              total_usdt: Number(total.toFixed(6)),
              total_usd: Number(total.toFixed(2)),
              transfer_count: transfers.length,
              updated_at: new Date().toISOString()
            };
            fs.writeFileSync('donations.json', JSON.stringify(result, null, 2) + '\n');
          }
          main().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Commit updated donation data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donations.json
          if git diff --cached --quiet; then
            echo "No donation data changes."
          else
            git commit -m "Update verified USDT donation total"
            git push
          fi
