name: Update verified USDT donations

on:
  push:
    paths:
      - '.github/workflows/update-donations.yml'
      - 'donations.json'
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: update-usdt-donations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read confirmed incoming USDT transfers and record them privately
        env:
          TRONSCAN_API_KEY: ${{ secrets.TRONSCAN_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: https://mxyabxgjpmpryrmzfnko.supabase.co
          WALLET: TYtWeZ6Xf9a8uACp35Bv2BpgmZjrHt8mTG
          USDT_CONTRACT: TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t
        run: |
          node <<'NODE'
          const fs = require('fs');
          const API = 'https://api.trongrid.io';
          if (!process.env.SUPABASE_SERVICE_ROLE_KEY) throw new Error('Missing SUPABASE_SERVICE_ROLE_KEY repository secret.');
          function tokenAmount(rawValue, decimals) {
            const raw = BigInt(String(rawValue || '0'));
            const divisor = 10n ** BigInt(decimals);
            const whole = raw / divisor;
            const fraction = (raw % divisor).toString().padStart(decimals, '0').replace(/0+$/, '');
            return fraction ? whole.toString() + '.' + fraction : whole.toString();
          }

          async function processTransfer(tx, seen) {
            if (String(tx.contract_address || '').toLowerCase() !== process.env.USDT_CONTRACT.toLowerCase()) return;
            if (String(tx.to_address || '').toLowerCase() !== process.env.WALLET.toLowerCase()) return;
            if (tx.confirmed !== true || tx.revert === true || tx.finalResult !== 'SUCCESS' || tx.event_type !== 'Transfer') return;
            if (String(tx.tokenInfo?.tokenId || '').toLowerCase() !== process.env.USDT_CONTRACT.toLowerCase()) return;
            const txid = String(tx.transaction_id || '');
            const sender = String(tx.from_address || '');
            if (!/^[0-9a-fA-F]{64}$/.test(txid) || seen.has(txid)) return;
            const decimals = Number(tx.tokenInfo?.tokenDecimal);
            if (!Number.isInteger(decimals) || decimals !== 6) throw new Error('Unexpected USDT decimal metadata; refusing to record.');
            const amount = tokenAmount(tx.quant, decimals);
            if (!(Number(amount) > 0)) return;
            const blockNumber = Number(tx.block);
            const blockTimestamp = Number(tx.block_ts);
            if (!Number.isSafeInteger(blockNumber) || blockNumber <= 0 || !Number.isFinite(blockTimestamp) || blockTimestamp <= 0) throw new Error('Missing block metadata for confirmed transfer ' + txid);
            const rpcResponse = await fetch(process.env.SUPABASE_URL + '/rest/v1/rpc/record_verified_usdt_transfer', {
              method: 'POST', headers: { apikey: process.env.SUPABASE_SERVICE_ROLE_KEY, Authorization: 'Bearer ' + process.env.SUPABASE_SERVICE_ROLE_KEY, 'Content-Type': 'application/json' },
              body: JSON.stringify({ p_amount: amount, p_transaction_id: txid, p_from_address: sender, p_block_timestamp: new Date(blockTimestamp).toISOString(), p_block_number: blockNumber })
            });
            if (!rpcResponse.ok) throw new Error('Supabase rejected transfer ' + txid + ' (HTTP ' + rpcResponse.status + '): ' + (await rpcResponse.text()).slice(0, 400));
            const saved = await rpcResponse.json();
            if (!saved || typeof saved.inserted !== 'boolean') throw new Error('Unexpected Supabase response for transfer ' + txid);
            seen.add(txid);
            console.log('Verified solidified transfer processed; inserted:', saved.inserted, 'duplicate:', saved.duplicate === true);
          }

          async function fetchTransferPage(fingerprint) {
            const params = new URLSearchParams({ only_confirmed: 'true', only_to: 'true', contract_address: process.env.USDT_CONTRACT, limit: '200', order_by: 'block_timestamp,desc' });
            if (fingerprint) params.set('fingerprint', fingerprint);
            const response = await fetch(API + '/v1/accounts/' + encodeURIComponent(process.env.WALLET) + '/transactions/trc20?' + params.toString(), { headers: { accept: 'application/json' } });
            const raw = await response.text();
            if (!response.ok) throw new Error('TronGrid TRC20 history HTTP ' + response.status + ': ' + raw.slice(0, 300));
            let body;
            try { body = JSON.parse(raw); } catch { throw new Error('TronGrid returned non-JSON: ' + raw.slice(0, 300)); }
            if (body?.success !== true || !Array.isArray(body.data) || !Number.isSafeInteger(Number(body.meta?.page_size))) throw new Error('Unexpected TronGrid response: ' + JSON.stringify({ keys: Object.keys(body || {}), success: body?.success, page_size: body?.meta?.page_size, data_is_array: Array.isArray(body?.data) }));
            return { rows: body.data, fingerprint: body.meta?.fingerprint || null };
          }

          async function getSolidifiedReceipt(txid) {
            const response = await fetch(API + '/walletsolidity/gettransactioninfobyid', { method: 'POST', headers: { accept: 'application/json', 'Content-Type': 'application/json' }, body: JSON.stringify({ value: txid }) });
            const raw = await response.text();
            if (!response.ok) throw new Error('TRON solidified receipt HTTP ' + response.status + ': ' + raw.slice(0, 300));
            let receipt;
            try { receipt = JSON.parse(raw); } catch { throw new Error('TRON receipt returned non-JSON for ' + txid); }
            if (receipt?.id !== txid || !Number.isSafeInteger(Number(receipt.blockNumber)) || Number(receipt.blockNumber) <= 0 || receipt.receipt?.result !== 'SUCCESS' || receipt.result === 'FAILED') throw new Error('Transfer ' + txid + ' is not verified successful and solidified; refusing to record.');
            return receipt;
          }

          async function main() {
            const seen = new Set();
            let fingerprint = null;
            let pageCount = 0;
            let transferCount = 0;
            do {
              const page = await fetchTransferPage(fingerprint);
              pageCount++;
              transferCount += page.rows.length;
              if (pageCount === 1) {
                const first = page.rows[0] || null;
                console.log('TronGrid response diagnostic:', JSON.stringify({ page_size: page.rows.length, has_more: Boolean(page.fingerprint), first_row_keys: first ? Object.keys(first) : [], first_transfer: first ? { type: first.type, token: first.token_info?.address, decimals: first.token_info?.decimals, to_matches: String(first.to || '').toLowerCase() === process.env.WALLET.toLowerCase(), value_present: first.value != null, txid_present: Boolean(first.transaction_id), timestamp_present: Boolean(first.block_timestamp) } : null }));
              }
              for (const row of page.rows) {
                if (row.type !== 'Transfer' || String(row.token_info?.address || '').toLowerCase() !== process.env.USDT_CONTRACT.toLowerCase() || String(row.to || '').toLowerCase() !== process.env.WALLET.toLowerCase()) continue;
                const txid = String(row.transaction_id || '');
                if (!/^[0-9a-fA-F]{64}$/.test(txid)) throw new Error('TronGrid returned an invalid transaction ID.');
                if (seen.has(txid)) continue;
                const receipt = await getSolidifiedReceipt(txid);
                await processTransfer({ transaction_id: txid, contract_address: row.token_info.address, to_address: row.to, from_address: row.from, confirmed: true, revert: false, finalResult: receipt.receipt.result, event_type: row.type, tokenInfo: { tokenId: row.token_info.address, tokenDecimal: row.token_info.decimals }, quant: row.value, block: receipt.blockNumber, block_ts: row.block_timestamp }, seen);
              }
              fingerprint = page.fingerprint;
              if (pageCount > 500) throw new Error('TronGrid pagination exceeded 500 pages; refusing an incomplete scan.');
            } while (fingerprint);
            console.log('Completed TronGrid confirmed incoming USDT scan:', pageCount, 'pages,', transferCount, 'raw rows,', seen.size, 'verified unique transfers.');

            const totalsResponse = await fetch(process.env.SUPABASE_URL + '/rest/v1/rpc/get_verified_usdt_donation_totals', { method: 'POST', headers: { apikey: process.env.SUPABASE_SERVICE_ROLE_KEY, Authorization: 'Bearer ' + process.env.SUPABASE_SERVICE_ROLE_KEY, 'Content-Type': 'application/json' }, body: '{}' });
            if (!totalsResponse.ok) throw new Error('Supabase cumulative totals request failed (HTTP ' + totalsResponse.status + '): ' + (await totalsResponse.text()).slice(0, 400));
            const totals = await totalsResponse.json();
            const total = Number(totals?.total_usdt);
            const count = Number(totals?.transfer_count);
            if (!Number.isFinite(total) || total < 0 || !Number.isSafeInteger(count) || count < 0) throw new Error('Supabase returned invalid cumulative totals; refusing to publish.');
            const result = { status: 'verified', network: 'TRON', token: 'USDT', wallet: process.env.WALLET, goal_usd: 2800, total_usdt: Number(total.toFixed(6)), total_usd: Number(total.toFixed(2)), transfer_count: count, updated_at: new Date().toISOString() };
            fs.writeFileSync('donations.json', JSON.stringify(result, null, 2) + '\n');
            console.log('Published cumulative verified total:', result.total_usdt, 'USDT across', count, 'confirmed transfers.');
          }

          main().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Commit updated donation data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donations.json
          if git diff --cached --quiet; then
            echo "No donation data changes."
          else
            git commit -m "Update verified USDT donation total"
            git push
          fi
